components:
    schemas:
        Book:
            properties:
                author:
                    type: string
                isbn:
                    type: string
                title:
                    type: string
            required:
                - isbn
                - title
            type: object
        NewBookRequest:
            properties:
                title:
                    type: string
            required:
                - title
            type: object
info:
    title: API Documentation
    version: 1.0.0
openapi: 3.1.0
paths:
    /books:
        get:
            parameters:
                - in: query
                  name: author
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Book'
                                type: array
                    description: OK
            summary: List books
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/NewBookRequest'
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Book'
                    description: Created
            summary: Create a book
    /books/{isbn}:
        get:
            parameters:
                - in: path
                  name: isbn
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Book'
                    description: OK
            summary: Get a book
    /legacy:
        get:
            parameters:
                - in: query
                  name: author
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Book'
                                type: array
                    description: OK
            summary: Legacy endpoint
    /static/:
        get:
            responses:
                "200":
                    description: Successful response
