components:
    schemas:
        APIError:
            properties:
                message:
                    type: string
            required:
                - message
            type: object
        CreateUserRequest:
            properties:
                email:
                    type: string
            required:
                - email
            type: object
        User:
            properties:
                email:
                    type: string
                id:
                    type: string
            required:
                - email
                - id
            type: object
info:
    title: API Documentation
    version: 1.0.0
openapi: 3.1.0
paths:
    /users:
        get:
            parameters:
                - in: query
                  name: limit
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/User'
                                type: array
                    description: OK
            summary: List all users
            tags:
                - Users
        post:
            operationId: createUser
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateUserRequest'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                    description: OK
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/APIError'
                    description: Bad Request
            summary: Create a user
            tags:
                - Users
    /users/{id}:
        get:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                    description: OK
            summary: Get a user by ID
            tags:
                - Users
    /users/count:
        get:
            parameters:
                - in: query
                  name: limit
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/User'
                                type: array
                    description: OK
            summary: Count users
            tags:
                - Users
    /users/health:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                    description: OK
            tags:
                - Users
