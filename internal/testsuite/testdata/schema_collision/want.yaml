components:
    schemas:
        admin_User:
            properties:
                email:
                    type: string
                id:
                    type: string
                internal_notes:
                    type: string
                is_banned:
                    type: boolean
            required:
                - email
                - id
                - internal_notes
                - is_banned
            type: object
        internal_User:
            properties:
                shadow_ban:
                    type: boolean
            required:
                - shadow_ban
            type: object
        public_User:
            properties:
                handle:
                    type: string
            required:
                - handle
            type: object
info:
    title: API Documentation
    version: 1.0.0
openapi: 3.1.0
paths:
    /admin/user:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/admin_User'
                    description: OK
            summary: Admin view of a user
    /internal/user:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/internal_User'
                    description: OK
            summary: Internal view of a user
    /public/user:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/public_User'
                    description: OK
            summary: Public view of a user
