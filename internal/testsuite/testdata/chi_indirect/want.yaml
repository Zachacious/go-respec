components:
    schemas:
        Address:
            properties:
                id:
                    type: string
                street:
                    type: string
            required:
                - id
                - street
            type: object
        JSONError:
            properties:
                message:
                    type: string
            required:
                - message
            type: object
info:
    title: API Documentation
    version: 1.0.0
openapi: 3.1.0
paths:
    /addresses:
        post:
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Address'
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/JSONError'
                    description: Bad Request
            summary: Create a new address
            tags:
                - Addresses
    /addresses/{id}:
        delete:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "204":
                    description: No Content
            summary: Delete an address
            tags:
                - Addresses
        get:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Address'
                    description: OK
            summary: Get an address
            tags:
                - Addresses
    /addresses/health:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/JSONError'
                    description: OK
            summary: Health check
            tags:
                - Addresses
