components:
    schemas:
        Widget:
            properties:
                id:
                    type: string
                name:
                    type: string
            required:
                - id
                - name
            type: object
    securitySchemes:
        ApiKeyAuth:
            in: header
            name: X-API-Key
            type: apiKey
        BearerAuth:
            bearerFormat: JWT
            scheme: bearer
            type: http
info:
    title: Response Inference Fixture
    version: 1.0.0
openapi: 3.1.0
paths:
    /widgets:
        post:
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Widget'
                    description: Created
            summary: Create a widget
    /widgets/{id}:
        delete:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "204":
                    description: No Content
            summary: Delete a widget
        get:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Widget'
                    description: OK
            summary: Get a widget
