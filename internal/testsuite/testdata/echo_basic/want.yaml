components:
    schemas:
        NewProductRequest:
            properties:
                sku:
                    type: string
            required:
                - sku
            type: object
        Product:
            properties:
                price:
                    type: number
                sku:
                    type: string
            required:
                - price
                - sku
            type: object
info:
    title: API Documentation
    version: 1.0.0
openapi: 3.1.0
paths:
    /products/{sku}:
        get:
            parameters:
                - in: path
                  name: sku
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Product'
                    description: OK
            summary: Get a product
    /v1/products:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Product'
                                type: array
                    description: OK
            summary: List products
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/NewProductRequest'
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Product'
                    description: Created
            summary: Create a product
