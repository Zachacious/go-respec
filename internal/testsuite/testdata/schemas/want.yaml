components:
    schemas:
        Base:
            properties:
                created_at:
                    format: date-time
                    type: string
                id:
                    type: string
            required:
                - created_at
                - id
            type: object
        Envelope_Left:
            properties:
                data:
                    $ref: '#/components/schemas/Left'
                error:
                    type: string
            required:
                - data
            type: object
        Envelope_Node:
            properties:
                data:
                    $ref: '#/components/schemas/Node'
                error:
                    type: string
            required:
                - data
            type: object
        Left:
            properties:
                right:
                    $ref: '#/components/schemas/Right'
            type: object
        Node:
            properties:
                active:
                    type: boolean
                blob:
                    format: byte
                    type: string
                children:
                    items:
                        $ref: '#/components/schemas/Node'
                    type: array
                created_at:
                    format: date-time
                    type: string
                id:
                    type: string
                meta:
                    additionalProperties: {}
                    type: object
                name:
                    type: string
                nickname:
                    type:
                        - string
                        - "null"
                owner:
                    anyOf:
                        - $ref: '#/components/schemas/Base'
                        - type: "null"
                parent:
                    $ref: '#/components/schemas/Node'
                peers:
                    additionalProperties:
                        $ref: '#/components/schemas/Node'
                    type: object
                ratio:
                    type: number
            required:
                - active
                - created_at
                - id
                - name
                - nickname
                - owner
                - ratio
            type: object
        Right:
            properties:
                left:
                    $ref: '#/components/schemas/Left'
            type: object
info:
    title: API Documentation
    version: 1.0.0
openapi: 3.1.0
paths:
    /enveloped/left:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Envelope_Left'
                    description: OK
            summary: Returns a Left in the same envelope type.
    /enveloped/node:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Envelope_Node'
                    description: OK
            summary: Returns a node in an envelope.
    /left:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Left'
                    description: OK
            summary: Returns a mutually recursive value.
    /nodes:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Node'
                    description: OK
            summary: Returns a tree node.
