components:
    schemas:
        Status:
            properties:
                ok:
                    type: boolean
            required:
                - ok
            type: object
        User:
            properties:
                id:
                    type: string
            required:
                - id
            type: object
info:
    title: API Documentation
    version: 1.0.0
openapi: 3.1.0
paths:
    /health:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
                    description: OK
            summary: Health check
    /ok:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
                    description: OK
            summary: Ping
    /users:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/User'
                                type: array
                    description: OK
            summary: List users
    /users/{id}:
        get:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                    description: OK
            summary: Get a user
